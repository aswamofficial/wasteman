; /etc/php/8.3/fpm/pool.d/wasteman.conf
;
; A PHP-FPM pool of Wasteman's own, rather than sharing Clean Washroom's.
;
; Two reasons, both about not disturbing what is already running:
;
;   1. Workers. The default `www` pool has a fixed budget of child processes.
;      Put Wasteman on it and a burst of report submissions — or one classifier
;      call waiting on the Anthropic API — occupies workers Clean Washroom
;      needs, and Clean Washroom starts returning 502s for reasons nobody can
;      see from its own logs.
;
;   2. php.ini. Clean Washroom's upload limits live in
;      /etc/php/8.3/fpm/conf.d/99-cleanwashroom.ini, which is global: every pool
;      on this server inherits its 80 MB uploads and 256 MB memory limit. Rather
;      than edit that file — which would change Clean Washroom's behaviour —
;      Wasteman overrides what it needs here, where the setting reaches this
;      pool only.

[wasteman]

user = www-data
group = www-data

listen = /run/php/php8.3-fpm-wasteman.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; `ondemand`, not `dynamic`: this box has 4 GB shared with Clean Washroom and
; MySQL. Wasteman's traffic is a handful of citizens at a time, so idle workers
; are pure cost — these start on the first request and retire when quiet.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Visible as "pool wasteman" in the FPM log, so a problem here is attributable.
php_admin_value[error_log] = /var/log/php8.3-fpm-wasteman.log
php_admin_flag[log_errors] = on

; A report photo is capped at 8 MB by the upload validator; the rest is the
; multipart envelope. Deliberately far below Clean Washroom's 80 MB — Wasteman
; has no reason to accept a file that large, and the two no longer have to agree.
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[max_file_uploads] = 6

; Base64-encoding a photo for the vision call briefly holds the image twice.
php_admin_value[memory_limit] = 256M

; Comfortably past the classifier's own 45s client timeout, so a slow call
; fails at the SDK and lands on the stub rather than being cut off here.
php_admin_value[max_execution_time] = 120
