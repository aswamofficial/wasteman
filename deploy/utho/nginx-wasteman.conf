# /etc/nginx/sites-available/wasteman
#
# Wasteman shares the Utho box with Clean Washroom. This file adds server
# blocks; it changes nothing that already exists. Two rules keep it that way:
#
#   - `server_name` is explicit and `default_server` appears nowhere. A request
#     for a Clean Washroom hostname can never fall into these blocks.
#   - every path points inside /var/www/wasteman.
#
# The app lives on app.wasteman.in, matching how Clean Washroom separates
# app.cleanwashroom.org from its root domain. The apex is left free for a
# landing page later and redirects there for now, so the application has one
# canonical address instead of answering on two.
#
# The API stays on the SAME host as the app, at /api, rather than moving to an
# api. subdomain. One origin means the browser makes no cross-origin request:
# no CORS preflight, no second certificate name to keep alive, no cookie-domain
# juggling. Clean Washroom splits app./api. because it was built that way;
# there is no reason to inherit it.

# ---------------------------------------------------------------- the app
server {
    listen 80;
    listen [::]:80;
    server_name app.wasteman.in;

    # The built Ionic bundle.
    root /var/www/wasteman/wastenotify-app/dist;
    index index.html;

    # Report photos are validated at 8 MB; leave room for the multipart
    # envelope. Scoped to this block, so Clean Washroom's 80 MB is untouched.
    client_max_body_size 12M;

    access_log /var/log/nginx/wasteman.access.log;
    error_log  /var/log/nginx/wasteman.error.log;

    # Vite writes content-hashed filenames, so these can never go stale.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Laravel ----------------------------------------------------------
    # `^~` so these win over any regex location and the SPA fallback below
    # never swallows an API call.
    location ^~ /api {
        try_files $uri @laravel;
    }

    # Laravel also owns the routes that are not under /api: the published
    # privacy policy and terms, which have to be reachable without an account.
    location ^~ /legal {
        try_files $uri @laravel;
    }

    # Uploaded report photos, served straight off disk.
    #
    # Pointed at the real directory rather than through Laravel's public/storage
    # symlink — one less thing that can be missing after a deploy. The trailing
    # slash on both sides of the alias is load-bearing.
    location ^~ /storage/ {
        alias /var/www/wasteman/wastenotify-api/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location @laravel {
        # Wasteman's own pool. A slow classification here cannot occupy a worker
        # Clean Washroom needs.
        fastcgi_pass unix:/run/php/php8.3-fpm-wasteman.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/wasteman/wastenotify-api/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/wasteman/wastenotify-api/public;
        # A photo going to the model plus the upload itself. The classifier's
        # own client gives up at 45s, so this only has to outlast that.
        fastcgi_read_timeout 120;
    }

    # ---- SPA --------------------------------------------------------------
    # Deep links (/admin/reports/9, /reports/22) are client-side routes; the
    # server has no file for them and must hand back the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dotfiles stay private, except the ACME challenge certbot needs. Scanners
    # start probing for .env within minutes of a new name appearing in the
    # certificate transparency log, so this is not theoretical.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ------------------------------------------------- apex and www -> the app
# 301, not 302: this is the permanent shape of the site, and a permanent
# redirect is what stops search engines indexing the application on two
# different hostnames. Replace this block with a landing page when there is
# one — nothing else needs to change.
server {
    listen 80;
    listen [::]:80;
    server_name wasteman.in www.wasteman.in;

    return 301 https://app.wasteman.in$request_uri;
}
